<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Turmas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Sistema Escola</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Início</a>
                <a class="nav-link" href="/frontend/alunos.html">Alunos</a>
                <a class="nav-link" href="/frontend/professores.html">Professores</a>
                <a class="nav-link" href="/frontend/funcionarios.html">Funcionários</a>
            </div>
        </div>
    </nav>

    <main class="container mb-5" style="max-width: 600px;">

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <h1 class="h4 fw-bold mb-4">Cadastro de Turmas</h1>

                <form id="form-turma">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="curso" class="form-label">Curso:</label>
                            <input type="text" id="curso" name="curso" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label for="modulo" class="form-label">Módulo / Semestre:</label>
                            <input type="text" id="modulo" name="modulo" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label for="ano" class="form-label">Ano / Data:</label>
                            <input type="date" id="ano" name="ano" class="form-control" required>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary w-100 py-2">Cadastrar Turma</button>
                        </div>
                    </div>
                </form>

                <div id="mensagem" class="mt-3 text-center" aria-live="polite"></div>

                <div class="text-center mt-3">
                    <a href="/" class="text-decoration-none text-muted small">Voltar para o início</a>
                </div>

            </div>
        </div>

    </main>

    <script src="/frontend/js/turma.js"></script>

</body>

</html>
