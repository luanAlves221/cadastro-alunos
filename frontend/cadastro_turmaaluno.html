<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Turma e Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Sistema Escola</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Início</a>
                <a class="nav-link" href="/frontend/alunos.html">Alunos</a>
                <a class="nav-link" href="/frontend/professores.html">Professores</a>
                <a class="nav-link" href="/frontend/funcionarios.html">Funcionários</a>
            </div>
        </div>
    </nav>

    <main class="container mb-5" style="max-width: 600px;">

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <h1 class="h4 fw-bold mb-4">Vincular Turma e Aluno</h1>

                <form id="form-turma-aluno">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="codTurma" class="form-label">Turma:</label>
                            <select id="codTurma" name="codTurma" class="form-select" required>
                                <option value="">Selecione uma turma</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="codAluno" class="form-label">Aluno:</label>
                            <select id="codAluno" name="codAluno" class="form-select" required>
                                <option value="">Selecione um aluno</option>
                            </select>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary w-100 py-2">Vincular Aluno à Turma</button>
                        </div>
                    </div>
                </form>

                <div id="mensagem" class="mt-3 text-center" aria-live="polite"></div>

                <div class="text-center mt-3">
                    <a href="/" class="text-decoration-none text-muted small">Voltar para o início</a>
                </div>

            </div>
        </div>

    </main>

    <script src="/frontend/js/turmaaluno.js"></script>

</body>

</html>
