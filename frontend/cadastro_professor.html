<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Professores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Sistema Escola</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Início</a>
                <a class="nav-link" href="/frontend/alunos.html">Alunos</a>
                <a class="nav-link active" href="/frontend/professores.html">Professores</a>
                <a class="nav-link" href="/frontend/funcionarios.html">Funcionários</a>
            </div>
        </div>
    </nav>

    <main class="container mb-5" style="max-width: 700px;">

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h4 fw-bold mb-0">Cadastro de Professores</h1>
                    <a href="/frontend/professores.html" class="btn btn-sm btn-outline-secondary">Ver todos</a>
                </div>

                <form id="form-professor">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label for="nome" class="form-label">Nome:</label>
                            <input type="text" id="nome" name="nome" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label for="cpf" class="form-label">CPF:</label>
                            <input type="text" id="cpf" name="cpf" class="form-control" placeholder="000.000.000-00" required>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">E-mail:</label>
                            <input type="email" id="email" name="email" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label for="telefone" class="form-label">Telefone:</label>
                            <input type="text" id="telefone" name="telefone" class="form-control" placeholder="(00) 00000-0000" required>
                        </div>

                        <div class="col-md-6">
                            <label for="data_nascimento" class="form-label">Data de nascimento:</label>
                            <input type="date" id="data_nascimento" name="data_nascimento" class="form-control" required>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary w-100 py-2">Cadastrar Professor</button>
                        </div>
                    </div>
                </form>

                <div id="mensagem" class="mt-3 text-center" aria-live="polite"></div>

                <div class="text-center mt-3">
                    <a href="/" class="text-decoration-none text-muted small">Voltar para o início</a>
                </div>

            </div>
        </div>

    </main>

    <script src="/frontend/js/professor.js"></script>

</body>

</html>
