<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professores Cadastrados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Sistema Escola</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Início</a>
                <a class="nav-link" href="/frontend/alunos.html">Alunos</a>
                <a class="nav-link active" href="/frontend/professores.html">Professores</a>
                <a class="nav-link" href="/frontend/funcionarios.html">Funcionários</a>
            </div>
        </div>
    </nav>

    <main class="container mb-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 fw-bold mb-0">Professores Cadastrados</h1>
            <a href="/" class="btn btn-outline-secondary">Voltar</a>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <h5 class="card-title fw-bold mb-3">
                    Filtrar Professores
                </h5>
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label for="campoFiltro" class="form-label">
                            Filtrar por
                        </label>
                        <select id="campoFiltro" class="form-select">
                            <option value="codProf">Código</option>
                            <option value="nome" selected>Nome</option>
                            <option value="cpf">CPF</option>
                            <option value="email">E-mail</option>
                            <option value="data_nascimento">Data de nascimento</option>
                            <option value="telefone">Telefone</option>
                        </select>
                    </div>

                    <div class="col-md-7">
                        <label for="textoFiltro" class="form-label">
                            Pesquisar
                        </label>
                        <input type="text" id="textoFiltro" class="form-control" placeholder="Digite o que deseja pesquisar...">
                    </div>

                    <div class="col-md-2">
                        <button type="button" id="btnLimparFiltro" class="btn btn-secondary w-100">
                            Limpar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Código</th>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>E-mail</th>
                                <th>Data de Nascimento</th>
                                <th>Telefone</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaProfessores">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script src="/frontend/js/professor.js"></script>

</body>

</html>
